; Zenith motor test bench — PlatformIO configuration
;
; Environments:
;   sensor    Teensy 4.1 "sensor" board (ESC, sensors, safety)   <- default
;   control   Teensy 4.1 "control" board (operator interface)    <- no code yet
;   teensy41  Alias of `sensor` (keeps `pio run -e teensy41` valid)
;   native    Unit tests on PC (Unity), no hardware
;
; Dependencies are pinned to an exact version (AGENTS.md).

[platformio]
; Without this, a bare `pio run` (CI, Docker) would also build `native` and `control`.
default_envs = sensor

; Sources live in the firmware/ root (communication/, sensors/, protocol/, safety/, ...),
; not in src/. Chosen over moving everything under src/ because the layout already exists.
; Consequence: PlatformIO would scan everything (lib/, test/, .pio/), so every env MUST
; set build_src_filter to list what it compiles. src_dir is also an include root, so
; `#include "protocol/messages.hpp"` works from any source file.
src_dir = .

; ---------------------------------------------------------------------------
; Shared base for the Teensy boards (a named section, not [env]: `native` must
; inherit neither the platform nor the hardware libraries).
; ---------------------------------------------------------------------------
[teensy_common]
platform = teensy@5.1.0
board = teensy41
framework = arduino

; FlexCAN_T4, SPI, Wire, Servo and SD ship with Teensyduino: not listed.
lib_deps =
    finani/ICM42688@1.1.0
    nrf24/RF24@1.4.11
    sparkfun/SparkFun Qwiic Scale NAU7802 Arduino Library@1.0.6

build_flags =
    -Wall
    -D SERIAL_BAUD=115200

; The Teensy USB serial port ignores the baud rate; kept for form.
monitor_speed = 115200

; ---------------------------------------------------------------------------
; Sensor Teensy: drives the ESC, reads the sensors, owns all the safety logic.
; ---------------------------------------------------------------------------
[env:sensor]
extends = teensy_common
build_flags =
    ${teensy_common.build_flags}
    -D BOARD_ROLE_SENSOR
; src/main.cpp is the current entry point (to be migrated to modules/sensor_teensy/).
; communication/mock/ is excluded: mocks are for native tests only (convention proposed,
; to confirm when the first HAL is written).
build_src_filter =
    -<*>
    +<src/>
    +<communication/>
    -<communication/mock/>
    +<sensors/>
    +<protocol/>
    +<safety/>
    +<logging/>
    +<modules/sensor_teensy/>

; ---------------------------------------------------------------------------
; Control Teensy: operator interface, sends commands at 20 Hz.
; No code exists yet. The filter lists only what the control board needs, and not src/
; (the sensor entry point): while modules/control_teensy/ is missing, the env fails to
; build instead of silently producing the sensor firmware.
; TODO: the nRF24 driver will live in sensors/ (AGENTS.md); add it here when it exists.
; ---------------------------------------------------------------------------
[env:control]
extends = teensy_common
build_flags =
    ${teensy_common.build_flags}
    -D BOARD_ROLE_CONTROL
build_src_filter =
    -<*>
    +<communication/>
    -<communication/mock/>
    +<protocol/>
    +<modules/control_teensy/>

; ---------------------------------------------------------------------------
; Legacy alias of `sensor`.
; ---------------------------------------------------------------------------
[env:teensy41]
extends = env:sensor

; ---------------------------------------------------------------------------
; PC tests (mocks, no hardware). The hardware-bound libraries in lib/ are ignored:
; they include Arduino.h / FlexCAN_T4.h / RF24.h.
; Tests live in firmware/test/. -I. (the firmware/ root) lets them include headers such as protocol/messages.hpp.
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags =
    -Wall
    -std=gnu++17
    -I.
lib_ignore =
    ESCcontroller
    IMUReader
    LoadCellReader
    NRF24
    PowerModule
    PowerMonitor
